name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # tests/test_saaf.py shells out to .venv/bin/python, so install into a repo-local venv
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Run tests
        run: .venv/bin/python -m xmlrunner discover -s tests -o test-results
        env:
          # The suite never calls the API (mocked or --dry-run); the key is a dummy.
          ANTHROPIC_API_KEY: ci-dummy-key

      # Writes the job summary and, on same-repo PRs, one updated PR comment
      - name: Publish test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/*.xml
          check_name: Test report
          comment_mode: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'off' }}
          compare_to_earlier_commit: false

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
