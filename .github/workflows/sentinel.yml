name: Offline adapter contract

# The previous file was an accidental copy of sentinel_adapter.py, not YAML.
# The full Sentinel kit is not shipped here. This tests the actual retained
# adapter with its deterministic stub; it is not a full Sentinel scan.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: adapter-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install hash-locked runtime
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check
      - name: Exercise actual adapter with a stub model (no provider call)
        run: python -m unittest tests.test_sentinel_adapter -v
      - name: Record scope
        run: |
          echo "Offline parse/render/mapping regression tests only (synthetic responses; 2400 internal mapping cases). Full Sentinel kit and live model quality: not assessed." >> "$GITHUB_STEP_SUMMARY"

  customs:
    if: github.event_name == 'pull_request'
    uses: SAAF-Project/customs/.github/workflows/customs-reusable.yml@180829c8c6a98e4c4ebfe162d78de85dde6c8022 # v1.2.0
    with:
      customs-ref: 180829c8c6a98e4c4ebfe162d78de85dde6c8022
